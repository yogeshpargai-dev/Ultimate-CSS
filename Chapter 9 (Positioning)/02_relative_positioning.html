<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative</title>
    <link rel="stylesheet" href="positioning.css">
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box3{
            position: relative;
            top: 50px;
            left: 50px;
            text-align: center;
            font-size: 90px;
        }
    </style>
</head>
<body>
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3">This box is positioned by relative positioning</div>
    <div class="box box4"></div>
</body>
</html>
