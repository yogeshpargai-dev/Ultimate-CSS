<!-- A CSS selector used to style an element when it is in a specific state or condition. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo selector</title>
    <style>
        a:hover {
            color: rgb(231, 140, 29);
        }
        a:focus {
            background-color: darkred;
        }
        p:first-child {
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div>
        <p>I am first</p>
        <p>I am second</p>
    </div>
    <main>
        <a href="https://www.google.com">Google</a>
    </main>
</body>
</html>
