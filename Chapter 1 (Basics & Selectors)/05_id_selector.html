<!-- ID Selector (#id) – Selects one HTML element with a specific ID. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID selector</title>
    <style>
         /* This is an id selector  */
        #temp {
            background-color: rgb(138, 138, 229);
        }
    </style>
</head>
<body>
    <div id="temp">
        hey mitro!!!
    </div>
</body>
</html>
