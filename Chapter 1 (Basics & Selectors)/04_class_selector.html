<!-- Class Selector (.class) – Selects all HTML elements having a specific class. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selectors</title>
    <style>
        /* This ia a class selector  */
        .temp {
            background-color: bisque;
        }
       
    </style>
</head>
<body>
    <div class="temp">
        hey guys!!!
    </div>
</body>
</html>
