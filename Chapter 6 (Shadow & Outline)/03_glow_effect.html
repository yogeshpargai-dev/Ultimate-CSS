<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Effect</title>
    <style>
        .class {
            font-size: 50px;
            border: 2px solid black;
            text-align: center;
            padding: 50px;
            background-color: black;
            color: white;
            /* Multiple shadows can create a neon glow effect. */
            text-shadow: 0 0 10px #00f, 0 0 20px #00f, 0 0 30px #00f, 0 0 40px #00f;
        }
    </style>
</head>
<body>
    <div class="class">This is Glow effect</div>
</body>
</html>
