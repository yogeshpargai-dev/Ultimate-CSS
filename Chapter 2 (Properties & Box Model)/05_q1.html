<!-- Write html and css code to style a paragraph inside a div which contains 5 other paragraphs. The first paragraph must have background color yellow and text color red. The other paragraphs must have background color blue and text color white. The HMTL is written below for your reference. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1</title>
    <style>
        /* div p:first-child {
            background-color: yellow;
            color: red;
        }
        div p {
            background-color: blue;
            color: white;
        } OR */

        div p:nth-child(1) {
            background-color: yellow;
            color: red;
        }
        div p {
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>
    <div>
        <p>Hi i am 1st para</p>
        <p>Hi i am 2nd para</p>
        <p>Hi i am 3rd para</p>
        <p>Hi i am 4th para</p>
        <p>Hi i am 5th para</p>
    </div>
</body>
</html>
