<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS object Fit and position</title>
    <style>
        .container {
            height: 488px;
            width: 466px;
            border: 2px solid black;
            background-color: azure;
            background-image: url("https://images.unsplash.com/photo-1575936123452-b67c3203c357?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aW1hZ2V8ZW58MHx8MHx8fDA%3D");
            background-position: center ;
        }

        img {
            width: 466px;
            height: 488px;
            object-fit: contain;
        }

        .box {
            border: 2px solid rgb(172, 53, 53);
            background-color: rgb(221, 145, 145);
            width: 185px;
            height: 20px;
            position: absolute;
            left: 281px;
            bottom: 500px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">This image is in background</div>
    </div>
</body>

</html>
