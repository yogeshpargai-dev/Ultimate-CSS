<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline & Block</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box {
            border: 2px solid blue;
            /* Makes an element behave inline while still allowing width, height, padding, and margin. */
            display: inline-block;   
            width: 344px;
            padding:45px;
            margin: 34px; 
        }
        .temp {
            /* Convert inline element (i.e <span>) to block element. */
            display: block;
        }
    </style>
</head>

<body>
    <div class="box">
        I am a box
    </div>
    <div class="box">also a nice box</div>
    <span class="temp">I am a good</span>
    <span>boy</span>
</body>

</html>
