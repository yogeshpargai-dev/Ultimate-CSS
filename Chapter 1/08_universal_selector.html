<!-- Universal Selector (*) – Selects all HTML elements on the page. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal selector</title>
    <style>
        * {
            background-color: rgb(238, 150, 167);
            
        }
    </style>
</head>
<body>
    <header>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </header>
    <main>
        <article>
            <p>hello guys this is an universal selector</p>
        </article>
    </main>
</body>
</html>
