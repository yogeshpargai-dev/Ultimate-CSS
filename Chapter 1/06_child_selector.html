<!-- Child Selector (>) – Selects elements that are direct children of another element. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child selector</title>
    <style>
        /* This is a child selector  */
        div > p {
            background-color: rgb(193, 151, 233);
        }
    </style>
</head>
<body>
    <div>
        Hey guys, the background color below is applied using the child selector.
        <p>Hey lads!!</p>
    </div>
</body>
</html>
