<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image as Style</title>
    <style>
        nav ul li {
            background-color: yellowgreen;
            list-style-position: inside;
            border: 2px solid red;
            list-style-image: url("https://cdn.pixabay.com/animation/2025/06/03/04/09/04-09-45-17_512.gif");
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
</body>

</html>
