<!-- Origin: CSS rules can come from different sources,
such as the browser's default stylesheet, user/extension styles,
or the author's stylesheet. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin</title>
</head>

<body>
    <h1>I am a good guy</h1>

    You didn't write any CSS for the &lt h1 &gt. But when you open it in the browser, it still looks something like this:
    Large text
    Bold
    Some margin around it
    Where did that styling come from?
    The browser has its own built-in stylesheet, called the User Agent stylesheet.
</body>

</html>
