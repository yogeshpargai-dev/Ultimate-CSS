<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Areas</title>
    <style>
        .container {
            border: 2px solid black;
            display: grid;
            grid-template-areas: "nav nav nav"
                                 "side article article"
                                 "last footer footer";
        }
        .item {
            height: 55px;
        }
        .item1 {
            grid-area: nav;
            background-color: blueviolet;
        }
        .item2 {
            grid-area: side;
            background-color: cyan;
        }
        .item3 {
            grid-area: article;
            background-color: rgb(67, 67, 206);
        }
        .item4 {
            background-color: rgb(142, 212, 72);
            grid-area: footer;
        }
        .item5 {
            background-color: rgb(172, 64, 172);
            grid-area: last;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
        <div class="item item5">5</div>
    </div>
</body>
</html>
