<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOX shadow</title>
    <style>
        .class {
            border: 2px solid red;
            padding: 20px;
            background-color: yellow;
            text-align: center;
            box-shadow: 5px 5px 15px 5px #07e036;
        }
    </style>
</head>
<body>
    <div class="class">I am a Box with shadow</div>
</body>
</html>
