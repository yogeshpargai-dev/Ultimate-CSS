<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlines</title>
    <style>
        .temp {
            border: 2px solid red;
            border-radius: 3px;
            padding: 10px;
            text-align: center;
            background: rgb(235, 212, 6);
            outline: 3px solid black;
            outline-offset: 5px;
        }
    </style>
</head>

<body>
    <div class="temp">Hey i am inside border, Border is inside outline
    </div>
</body>

</html>
