<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Shadow</title>
    <style>
        .class {
            border: 4px solid black;
            padding: 10px;
            text-align: center;
            background-color: yellowgreen;
            text-shadow: 0px 0px 6px #fb0505;
        }
    </style>
</head>
<body>
    <div class="class">I am a text shadow</div>
</body>
</html>
